name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

# A re-dispatch of the same ref supersedes the release already in flight, so a
# bad tag can be re-cut without queueing behind the failed attempt. Tag pushes
# are not cancelled: the release and its assets are what that push produces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

# Creating a release and uploading assets both need write access. Repositories
# whose default workflow token is read-only would otherwise fail at the first
# release step.
permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      # Before the checkout, which uses the tag as a git ref. The input and the
      # ref are passed in through env rather than interpolated into the script,
      # so a crafted tag cannot execute code in this job, which holds
      # contents: write.
      - name: Resolve and validate version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # The expected release tag shape: v1.2.3, with an optional pre-release
          # suffix. Git allows $( ), backticks, quotes and spaces in a ref name,
          # and this value is reused as a ref and in output filenames, so reject
          # anything that is not a plain version tag before it is used.
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid release tag: '$VERSION'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On workflow_dispatch the default ref is the branch, not the tag, so
          # the changelog and build would come from the wrong commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since previous tag
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save to file for multiline output
          echo "${CHANGELOG}" > CHANGELOG.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false

  build-binaries:
    name: Build Binary for ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: llm-over-dns-linux-amd64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: llm-over-dns-linux-amd64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: llm-over-dns-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: llm-over-dns-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: llm-over-dns-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: llm-over-dns-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Same as the create-release job: build the tagged commit, not the branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Select cross linker (Linux arm64)
        # Without this the aarch64 leg links with the host gcc and fails, so no
        # arm64 asset is ever produced. Scoped to this job through the
        # environment rather than a committed .cargo/config.toml, which would
        # also apply to every local build.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Host binutils cannot read an aarch64 ELF, so that leg needs the cross
          # toolchain's strip.
          if [ "$TARGET" = "aarch64-unknown-linux-gnu" ]; then
            STRIP="aarch64-linux-gnu-strip"
          else
            STRIP="strip"
          fi
          "$STRIP" "target/$TARGET/release/llm-over-dns"

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}-${{ needs.create-release.outputs.version }}.tar.gz llm-over-dns
          cd ../../..
          sha256sum ${{ matrix.name }}-${{ needs.create-release.outputs.version }}.tar.gz > ${{ matrix.name }}-${{ needs.create-release.outputs.version }}.tar.gz.sha256

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path llm-over-dns.exe -DestinationPath ../../../${{ matrix.name }}-${{ needs.create-release.outputs.version }}.zip
          cd ../../..
          (Get-FileHash ${{ matrix.name }}-${{ needs.create-release.outputs.version }}.zip -Algorithm SHA256).Hash | Out-File -Encoding ASCII ${{ matrix.name }}-${{ needs.create-release.outputs.version }}.zip.sha256

      # action-gh-release attaches to the existing release for this tag and takes
      # a glob, so the archive and its checksum go up in one step per platform.
      - name: Upload release assets (Unix)
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            ${{ matrix.name }}-${{ needs.create-release.outputs.version }}.tar.gz
            ${{ matrix.name }}-${{ needs.create-release.outputs.version }}.tar.gz.sha256

      - name: Upload release assets (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            ${{ matrix.name }}-${{ needs.create-release.outputs.version }}.zip
            ${{ matrix.name }}-${{ needs.create-release.outputs.version }}.zip.sha256

  # The release is created before the binaries are built, so a matrix leg that
  # fails leaves a release page that looks complete. This turns that into a red
  # run instead of a silently missing asset.
  verify-binaries:
    name: Verify Release Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-binaries
    if: always()
    steps:
      - name: Fail if any target failed
        env:
          RESULT: ${{ needs.build-binaries.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "❌ At least one release target did not succeed (result: $RESULT)"
            exit 1
          fi
          echo "✅ All release targets built and uploaded"
